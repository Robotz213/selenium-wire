[tool.black]
line-length = 119
skip-string-normalization = true
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3

[dependency-groups]
dev = [
  "blinker>=1.4",
  "certifi>=2019.9.11",
  "h2>=4.0; python_version>='3.6.0'",
  "hyperframe>=6.0; python_version>='3.6.0'",
  "kaitaistruct>=0.7",
  "pyasn1>=0.3.1",
  "cryptography==50.0.1",
  "pyOpenSSL>=26.4.0",
  "pyparsing>=2.4.2",
  "pysocks>=1.7.1",
  "selenium>=4.0.0",
  "wsproto>=0.14",
  "zstandard>=0.14.1",
  "gitpython>=3.1.61",
  "ruff>=0.16.5",
  "pre-commit>=4.6.2",
  "pyright>=1.1.411",
]


[tool.pyright]
typeCheckingMode = "standard"
# Dívida técnica preexistente. Estas categorias permanecem visíveis nos
# editores, mas não bloqueiam o gate enquanto os contratos legados são
# migrados de forma incremental.
reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportFunctionMemberAccess = "none"
reportIncompatibleMethodOverride = "none"
reportIncompatibleVariableOverride = "none"
reportInvalidTypeForm = "none"
reportInvalidTypeVarUse = "none"
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportOperatorIssue = "none"
reportReturnType = "none"
reportUnknownMemberType = "none"
